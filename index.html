<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birlik Oyuncak - Kategoriler</title>
    <!-- Veritabanı dosyamızı çağırıyoruz -->
    <script src="urunler.js"></script>
    <script>
        // Yönetim panelinden güncellenen verileri alıyoruz
        const savedDB = localStorage.getItem('birlikOyuncakDB');
        if (savedDB) {
            window.urunlerVeritabani = JSON.parse(savedDB);
        }

        const savedBosKat = localStorage.getItem('birlikBosKategoriler');
        if (savedBosKat) {
            window.bosKategorilerDB = JSON.parse(savedBosKat);
        }

        // Yönetim panelinden kaydedilen kategori sırasını localStorage'a güncelliyoruz
        const savedKatSira = localStorage.getItem('birlikKategoriSirasi');
        if (savedKatSira) {
            window.kategoriSirasiDB = JSON.parse(savedKatSira);
        }
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f5f6f9;
            color: #333;
        }

        /* Top Bar */
        .top-bar {
            background-color: #1a252f;
            color: #fff;
            padding: 8px 0;
            font-size: 0.85rem;
        }

        .top-bar-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top-bar a {
            color: #ffca28;
            text-decoration: none;
            font-weight: bold;
        }

        /* Header */
        header {
            background-color: #fff;
            padding: 18px 0;
            border-bottom: 1px solid #e0e0e0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo a {
            text-decoration: none;
        }

        .logo h1 {
            color: #d32f2f;
            font-size: 1.8rem;
            font-weight: 800;
        }

        .logo span {
            color: #1976d2;
        }

        /* Arama Kutusu */
        .search-box {
            flex-grow: 1;
            max-width: 650px;
            display: flex;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 20px;
            font-size: 0.95rem;
            border: 2px solid #d32f2f;
            border-radius: 25px;
            outline: none;
        }

        .search-box button {
            position: absolute;
            right: 4px;
            top: 4px;
            bottom: 4px;
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 0 25px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Navbar / Kategoriler */
        nav {
            background-color: #d32f2f;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            list-style: none;
            overflow-x: auto;
        }

        .nav-container li a {
            display: block;
            padding: 12px 18px;
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .nav-container li a:hover {
            background-color: #b71c1c;
        }

        /* Main Container */
        .main-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .section-title {
            font-size: 1.4rem;
            color: #222;
            margin-bottom: 20px;
            padding-bottom: 8px;
            border-bottom: 3px solid #d32f2f;
            display: inline-block;
        }

        /* Kategori Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        @media (max-width: 900px) {
            .products-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .products-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Kategori Kartı */
        .product-card {
            background: #fff;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
            transition: all 0.2s ease-in-out;
            display: flex;
            flex-direction: column;
            position: relative;
            text-decoration: none;
            color: inherit;
        }

        .product-card:hover {
            box-shadow: 0 8px 18px rgba(0,0,0,0.1);
            transform: translateY(-3px);
        }

        .product-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background-color: #fafafa;
        }

        .product-details {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 15px;
            text-align: center;
        }

        .btn-go-category {
            width: 100%;
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 10px 0;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            text-align: center;
            margin-top: auto;
        }

        .btn-go-category:hover {
            background-color: #b71c1c;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: #888;
            font-size: 1.1rem;
            display: none;
        }

        /* Footer */
        footer {
            background-color: #1a252f;
            color: #b0bec5;
            padding: 25px 0;
            margin-top: 50px;
            text-align: center;
            font-size: 0.85rem;
            border-top: 1px solid #37474f;
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="top-bar-container">
            <span>Toptan ve Perakende Ürün Satış Sitemiz</span>
            <span>Destek: <a href="tel:0545 731 97 63">0545 731 97 63</a></span>
        </div>
    </div>

    <!-- Header -->
    <header>
        <div class="header-container">
            <div class="logo">
                <a href="index.html"><h1>JET<span>PAZARLAMA</span></h1></a>
            </div>

            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Kategori adı yazarak arayın..." onkeyup="filterProducts()">
                <button type="button">Ara</button>
            </div>
        </div>
    </header>

    <!-- Navigation -->
    <nav>
        <ul class="nav-container" id="navContainer">
            <li><a href="index.html">Ana Sayfa</a></li>  
        </ul>
    </nav>

    <!-- Main Content -->
    <div class="main-container">

        <h3 class="section-title">Ürün Kategorilerimiz</h3>

        <!-- Product Grid (Kategori Kartları Dinamik Yüklenecek) -->
        <div class="products-grid" id="productGrid">
            <!-- JavaScript ile otomatik doldurulacak -->
            <div class="no-results" id="noResults">Aradığınız kriterlere uygun kategori bulunamadı.</div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        &copy; 2026 Birlik Oyuncak - Tüm Hakları Saklıdır.
    </footer>

    <!-- Arama ve Dinamik Listeleme Fonksiyonu -->
    <script>
        function kategorileriYukle() {
            const grid = document.getElementById('productGrid');
            const navContainer = document.getElementById('navContainer');
            
            const kategorilerMap = {};
            const kategoriResimleri = {};

            // 1. Önce aktif boş kategori havuzundan resimleri alıyoruz (Ürün resimlerini kategori resmi olarak ezmemek için)
            let aktifBosKat = typeof bosKategorilerDB !== 'undefined' ? bosKategorilerDB : {};
            const savedBosKat = localStorage.getItem('birlikBosKategoriler');
            if (savedBosKat) {
                try {
                    aktifBosKat = JSON.parse(savedBosKat);
                } catch(e) {}
            }

            for (let kat in aktifBosKat) {
                kategorilerMap[kat] = true;
                kategoriResimleri[kat] = aktifBosKat[kat];
            }

            // 2. Ürünlerden gelen kategorileri topluyoruz (Eğer kategorinin havuzda resmi yoksa ilk ürünün resmini yedek olarak atıyoruz)
            if (typeof urunlerVeritabani !== 'undefined') {
                for (let id in urunlerVeritabani) {
                    const urun = urunlerVeritabani[id];
                    if (urun && urun.kategori) {
                        kategorilerMap[urun.kategori] = true;
                        if (!kategoriResimleri[urun.kategori]) {
                            kategoriResimleri[urun.kategori] = urun.resim;
                        }
                    }
                }
            }

            // 3. Sıralamayı al
            let siraliKategoriler = [];
            let kaynakSira = (typeof kategoriSirasiDB !== 'undefined' && kategoriSirasiDB.length > 0) 
                ? kategoriSirasiDB 
                : (localStorage.getItem('birlikKategoriSirasi') ? JSON.parse(localStorage.getItem('birlikKategoriSirasi')) : []);

            kaynakSira.forEach(kat => {
                if (kategorilerMap[kat]) {
                    siraliKategoriler.push(kat);
                    delete kategorilerMap[kat];
                }
            });

            for (let kat in kategorilerMap) {
                siraliKategoriler.push(kat);
            }

            let gridHTML = '';
            let navHTML = '<li><a href="index.html">Ana Sayfa</a></li>';

            siraliKategoriler.forEach(kat => {
                const resim = kategoriResimleri[kat] || '';

                gridHTML += `
                    <a href="kategori.html?kategori=${encodeURIComponent(kat)}" class="product-card" data-title="${kat.toLowerCase()}">
                        <img src="${resim}" class="product-image" alt="${kat}">
                        <div class="product-details">
                            <h4 class="product-title">${kat}</h4>
                            <span class="btn-go-category">Ürünlere Git</span>
                        </div>
                    </a>
                `;
            });

            navContainer.innerHTML = navHTML;
            grid.innerHTML = gridHTML + '<div class="no-results" id="noResults" style="display:none;">Aradığınız kriterlere uygun kategori bulunamadı.</div>';
        }

        window.onload = function() {
            kategorileriYukle();
        };

        function filterProducts() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.getElementsByClassName('product-card');
            let hasVisibleCard = false;

            for (let i = 0; i < cards.length; i++) {
                const title = cards[i].getAttribute('data-title') || cards[i].querySelector('.product-title').innerText.toLowerCase();

                if (title.includes(input)) {
                    cards[i].style.display = "";
                    hasVisibleCard = true;
                } else {
                    cards[i].style.display = "none";
                }
            }

            const noResults = document.getElementById('noResults');
            if(noResults) {
                noResults.style.display = hasVisibleCard ? "none" : "block";
            }
        }
    </script>
</body>
</html>
