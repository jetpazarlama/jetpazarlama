<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kategori Ürünleri - Birlik Oyuncak</title>
    <!-- Veritabanı dosyamızı çağırıyoruz -->
    <script src="urunler.js"></script>
    <script>
        const savedDB = localStorage.getItem('birlikOyuncakDB');
        if (savedDB) {
            window.urunlerVeritabani = JSON.parse(savedDB);
        }
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f5f6f9;
            color: #333;
        }

        /* Top Bar */
        .top-bar {
            background-color: #1a252f;
            color: #fff;
            padding: 8px 0;
            font-size: 0.85rem;
        }

        .top-bar-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top-bar a {
            color: #ffca28;
            text-decoration: none;
            font-weight: bold;
        }

        /* Header */
        header {
            background-color: #fff;
            padding: 18px 0;
            border-bottom: 1px solid #e0e0e0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo a {
            text-decoration: none;
        }

        .logo h1 {
            color: #d32f2f;
            font-size: 1.8rem;
            font-weight: 800;
        }

        .logo span {
            color: #1976d2;
        }

        /* Arama Kutusu */
        .search-box {
            flex-grow: 1;
            max-width: 650px;
            display: flex;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 20px;
            font-size: 0.95rem;
            border: 2px solid #d32f2f;
            border-radius: 25px;
            outline: none;
        }

        .search-box button {
            position: absolute;
            right: 4px;
            top: 4px;
            bottom: 4px;
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 0 25px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Navbar / Kategoriler */
        nav {
            background-color: #d32f2f;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            list-style: none;
            overflow-x: auto;
        }

        .nav-container li a {
            display: block;
            padding: 12px 18px;
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .nav-container li a:hover {
            background-color: #b71c1c;
        }

        /* Main Container */
        .main-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .category-header {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .category-header h2 {
            font-size: 1.5rem;
            color: #d32f2f;
        }

        .breadcrumb {
            font-size: 0.85rem;
            color: #666;
        }

        .breadcrumb a {
            color: #1976d2;
            text-decoration: none;
        }

        /* Ürün Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        @media (max-width: 900px) {
            .products-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .products-grid {
                grid-template-columns: 1fr;
            }
        }

        .product-card {
            background: #fff;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
            transition: all 0.2s ease-in-out;
            display: flex;
            flex-direction: column;
            position: relative;
            text-decoration: none;
            color: inherit;
        }

        .product-card:hover {
            box-shadow: 0 8px 18px rgba(0,0,0,0.1);
            transform: translateY(-3px);
        }

        .badge-discount {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: #d32f2f;
            color: white;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            z-index: 2;
        }

        .product-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background-color: #fafafa;
        }

        .product-details {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 10px;
            line-height: 1.3;
            height: 2.6em;
            overflow: hidden;
        }

        .product-price-box {
            margin-top: auto;
            margin-bottom: 12px;
        }

        .old-price {
            text-decoration: line-through;
            color: #9e9e9e;
            font-size: 0.85rem;
            margin-right: 6px;
        }

        .current-price {
            color: #d32f2f;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .btn-add-cart {
            width: 100%;
            background-color: #1976d2;
            color: white;
            border: none;
            padding: 9px 0;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: center;
        }

        .btn-add-cart:hover {
            background-color: #1565c0;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: #888;
            font-size: 1.1rem;
            display: none;
        }

        footer {
            background-color: #1a252f;
            color: #b0bec5;
            padding: 25px 0;
            margin-top: 50px;
            text-align: center;
            font-size: 0.85rem;
            border-top: 1px solid #37474f;
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="top-bar-container">
            <span>Toptan ve Perakende Ürün Satış Sitemiz</span>
            <span>Destek: <a href="tel:05555555555">0555 555 55 55</a></span>
        </div>
    </div>

    <!-- Header -->
    <header>
        <div class="header-container">
            <div class="logo">
                <a href="index.html"><h1>JET<span>PAZARLAMA</span></h1></a>
            </div>

            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Bu kategorideki ürünlerde ara..." onkeyup="filterProducts()">
                <button type="button">Ara</button>
            </div>
        </div>
    </header>

    <!-- Navigation -->
    <nav>
        <ul class="nav-container" id="navContainer">
            <li><a href="index.html">Ana Sayfa</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <div class="main-container">

        <div class="category-header">
            <h2 id="categoryTitle">Kategori Ürünleri</h2>
            <div class="breadcrumb">
                <a href="index.html">Ana Sayfa</a> / <span id="breadcrumbName">Kategori</span>
            </div>
        </div>

        <div class="products-grid" id="productGrid">
            <div class="no-results" id="noResults" style="display: none;">Aradığınız kriterlere uygun ürün bulunamadı.</div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        &copy; 2026 Birlik Oyuncak - Tüm Hakları Saklıdır.
    </footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const secilenKategori = urlParams.get('kategori') || "Aksesuar - Anahtarlık";

        document.getElementById('categoryTitle').innerText = secilenKategori + " - Ürün Listesi";
        document.getElementById('breadcrumbName').innerText = secilenKategori;
        document.title = secilenKategori + " - Birlik Oyuncak";

        const grid = document.getElementById('productGrid');
        const noResults = document.getElementById('noResults');
        const navContainer = document.getElementById('navContainer');

        function loadCategoriesNav() {
            let navHTML = '<li><a href="index.html">Ana Sayfa</a></li>';
            navContainer.innerHTML = navHTML;
        }

        function loadProducts() {
            grid.innerHTML = '';
            let count = 0;

            let urunDizisi = [];
            for (let id in urunlerVeritabani) {
                urunDizisi.push({ id: id, ...urunlerVeritabani[id] });
            }
            
            urunDizisi.sort((a, b) => (a.sira || 999) - (b.sira || 999));

            urunDizisi.forEach(urun => {
                if (urun.kategori === secilenKategori) {
                    count++;
                    
                    const card = document.createElement('a');
                    card.href = `urun-detay.html?id=${urun.id}`;
                    card.className = 'product-card';
                    card.setAttribute('data-title', urun.baslik.toLowerCase());

                    card.innerHTML = `
                        ${urun.indirim ? `<span class="badge-discount">${urun.indirim}</span>` : ''}
                        <img src="${urun.resim}" class="product-image" alt="${urun.baslik}">
                        <div class="product-details">
                            <h4 class="product-title">${urun.baslik}</h4>
                            <div class="product-price-box">
                                ${urun.eskiFiyat ? `<span class="old-price">${urun.eskiFiyat}</span>` : ''}
                                <span class="current-price">${urun.fiyat}</span>
                            </div>
                            <span class="btn-add-cart">Ürünü İncele</span>
                        </div>
                    `;
                    grid.appendChild(card);
                }
            });

            grid.appendChild(noResults);

            if (count === 0) {
                noResults.style.display = "block";
            } else {
                noResults.style.display = "none";
            }
        }

        window.onload = function() {
            loadCategoriesNav();
            loadProducts();
        };

        function filterProducts() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.getElementsByClassName('product-card');
            let hasVisibleCard = false;

            for (let i = 0; i < cards.length; i++) {
                const title = cards[i].getAttribute('data-title');

                if (title.includes(input)) {
                    cards[i].style.display = "";
                    hasVisibleCard = true;
                } else {
                    cards[i].style.display = "none";
                }
            }

            noResults.style.display = hasVisibleCard ? "none" : "block";
        }
    </script>
</body>
</html>
